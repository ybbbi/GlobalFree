name: globalfree
on:
  # 可手动触发工作流程
  workflow_dispatch:
  # push时触发工作流程
  push:
    # 分支 现在默认是main，而不是master
    branches: [ main ]
    # 将工作流程配置为在至少一个文件不匹配paths-ignore的paths时运行
    # 忽略README.md和imgs文件夹
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  # 定时触发工作流程
  schedule:
    # UTC 16点30分(北京时间 5:30)
    - cron: 30 21 * * *
  # 标星时触发工作流程
  watch:
    types: [started]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Checks out a copy of your repository on the ubuntu-latest machine
      # 必须，不然到执行 node checkin.js 时会报错
      - uses: actions/checkout@v2
      - name: setup Node.js
        # 理论上也可以自己命令行安装node
        uses: actions/setup-node@v1
        with:
          node-version: '14.20.1'
      - name: -i axios
        run: npm install axios@1.1.3
        # 安装 puppeteer-extra-plugin-stealth 绕过检测
      - name: -i dependencies
        run: npm install puppeteer@18.2.1 puppeteer-extra@3.3.4 puppeteer-extra-plugin-stealth@2.11.1
      - name: run
        run: node globalfree.js
        # 设置环境变量
        env:
          PUSHPLUS: ${{ secrets.PUSHPLUS }}
          COOKIES: ${{ secrets.COOKIES }}
        # 保持 action 活跃
      - name: keep alive action
        uses: efrecon/gh-action-keepalive@main # using the workflow with default settings
        # 删除工作流记录
  cleanup:


    runs-on: ubuntu-latest


    needs: build


    permissions:

      actions: write


    steps:


    - name: 清理旧运行记录

      uses: actions/github-script@v7

      with:

        script: |

          const runs = await github.rest.actions.listWorkflowRunsForRepo({

            owner: context.repo.owner,

            repo: context.repo.repo,

            per_page: 100

          });


          const keep = 1;


          const oldRuns = runs.data.workflow_runs.slice(keep);


          for (const run of oldRuns) {

            console.log(
              `删除: ${run.id}`
            );


            await github.rest.actions.deleteWorkflowRun({

              owner: context.repo.owner,

              repo: context.repo.repo,

              run_id: run.id

            });

          }
